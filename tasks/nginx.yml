---
- name: Install Nginx
  ansible.builtin.package:
    name: "{{ rustfs_nginx_package }}"
    state: present

- name: Install certificate and key from controller
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: "{{ rustfs_nginx_ssl_certificate_source }}", dest: "{{ rustfs_nginx_ssl_certificate }}", mode: '0644'}
    - {src: "{{ rustfs_nginx_ssl_certificate_key_source }}", dest: "{{ rustfs_nginx_ssl_certificate_key }}", mode: '0600'}
  when: item.src | length > 0
  no_log: true

- name: Render Nginx SNI reverse proxy
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ rustfs_nginx_config_path }}"
    owner: root
    group: root
    mode: '0644'
    validate: nginx -t -c %s
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

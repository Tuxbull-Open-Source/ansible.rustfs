---
- name: Install RustFS packages on RHEL-family systems
  ansible.builtin.dnf:
    name:
      - unzip
      - tar
      - "{{ rustfs_nginx_package }}"
      - openssl
      - python3-cryptography
    state: present
  when: rustfs_manage_packages | bool

- name: Mark RHEL-family dispatch
  ansible.builtin.set_fact:
    rustfs_dispatch_selected: rhelAll

- name: Install only RustFS prerequisites when Nginx is disabled
  ansible.builtin.dnf:
    name:
      - unzip
      - tar
    state: present
  when: rustfs_manage_packages | bool and not (rustfs_nginx_enabled | bool and rustfs_manage_nginx | bool)
